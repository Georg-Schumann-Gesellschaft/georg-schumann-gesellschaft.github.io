title: Georg Schumann Gesellschaft
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "sunrise"

locale: "de-DE"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true

navigation:
  main:
    - title: "Konzerte"
      url: /konzerte/
    - title: "Resonanz"
      url: /resonanz/
    - title: "Lebenslauf"
      url: /lebenslauf/
    - title: "Galerie"
      url: /gallery/
    - title: "Werkverzeichnis"
      url: /werkverzeichnis/
    - title: "Diskographie"
      url: /discography/
    - title: "Literatur"
      url: /bibliography/
    - title: "Publikationen"
      url: /publications/
    - title: "Kontakt"
      url: /kontakt/
    - title: "Über uns"
      url: /about/

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
